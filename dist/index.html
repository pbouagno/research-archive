 every partner, count, site and share is illustrative.", "short_summary": "Five levels of nationalised Starlink, L0 to L4, from a sovereign partition to nation-owned satellites under national command, each run from a sovereign national ops centre.", "stats": ["5 sovereignty levels (L0–L4)", "8 hypothetical partner nations", "352 example nation-owned satellites", "8 FCC-licensed shells"], "description": ["Nationalisation is treated as a ladder: each rung moves one more control from SpaceX to the nation, first where traffic lands, then who owns the satellites, and finally who holds the command keys. The model notes that no public source shows SpaceX selling satellites with transferred command authority to a foreign government; the closest public precedents are US-only (MILNET / SDN Backbone and the NRO's proliferated constellation).", "It covers the sovereign national ops centre, the split of control between SpaceX, the nation and the federation at L2, L3 and L4, laser-mesh routing handover, sovereignty controls, a layered architecture, feasibility and risks, and a table separating real facts from illustrative ones."], "explore": ["Constellation explorer: a ground map or 3D shell view (120× real time) with nation-owned satellites over a sampled commercial fleet, the laser mesh, sovereign ops centres and gateways.", "Routing policy switch (sovereign only, federated partners, full Starlink mesh) with a live route readout, showing why a small national fleet often has no end-to-end path.", "Participating nations table, sortable by satellites, level or capacity reservation.", "Split-of-control table that changes between L2 partition, L3 dedicated GOCO and L4 national command.", "Interactive layered-architecture diagram, filterable by nation, federated or SpaceX-retained control."], "tables": [{"title": "The five levels (L0–L4)", "columns": ["Level", "What it means", "Owns satellites", "Commands", "Traffic lands", "Public status"], "rows": [["L0 Commercial service", "Subscr
